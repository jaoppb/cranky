[package]
name = "cranky-time"
version.workspace = true
description = "The local time Cranky shows, read from the system time zone in safe Rust"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints.rust]
unused = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "forbid"

# The root `Cargo.toml` table, unchanged. `tests/architecture.rs` checks the
# two are equal.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
indexing_slicing = "forbid"
arithmetic_side_effects = "forbid"
unreachable = "forbid"
unimplemented = "forbid"
unchecked_time_subtraction = "forbid"
todo = "forbid"
string_slice = "forbid"
panic_in_result_fn = "forbid"
panic = "forbid"
exit = "forbid"
as_conversions = "forbid"
unwrap_in_result = "forbid"
get_unwrap = "forbid"
dbg_macro = "forbid"
print_stdout = "forbid"
print_stderr = "forbid"
self_named_module_files = "forbid"
min_ident_chars = "forbid"
