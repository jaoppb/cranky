# Dependency policy, checked by `just deps-check` (cargo-deny 0.20.2).

[graph]
# Cranky is a Wayland bar: only the Linux targets it is packaged for are
# evaluated, so crates other platforms would pull in are not judged.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# Vulnerability and unsound advisories are never ignored. An unmaintained
# crate may be ignored only when it is transitive and upstream has no fix, and
# each entry names the issue that removes it.
ignore = [
    { id = "RUSTSEC-2026-0249", reason = "smartstring is unmaintained and rhai still depends on it: https://github.com/jaoppb/cranky/issues/36" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained and cosmic-text still depends on it through fontdb: https://github.com/jaoppb/cranky/issues/37" },
]

[licenses]
# Permissive licences plus MPL-2.0, whose copyleft is per file and does not
# reach a binary that uses the crates unmodified. Anything else is denied.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between the members of a workspace carry no version.
allow-wildcard-paths = true
# Older versions that only a dependency can drop. Each entry names the crate
# that still requires it; remove the entry when that crate moves on.
skip = [
    { crate = "fontdb@0.23", reason = "cosmic-text 0.19 (usvg is on 0.24)" },
    { crate = "harfrust@0.5", reason = "cosmic-text 0.19 (usvg is on 0.15)" },
    { crate = "skrifa@0.40", reason = "cosmic-text 0.19 (usvg is on 0.49)" },
    { crate = "skrifa@0.44", reason = "swash 0.2, under cosmic-text" },
    { crate = "read-fonts@0.37", reason = "harfrust 0.5 and skrifa 0.40, under cosmic-text" },
    { crate = "read-fonts@0.41", reason = "skrifa 0.44, under swash" },
    { crate = "font-types@0.11", reason = "read-fonts 0.37, under cosmic-text" },
    { crate = "roxmltree@0.20", reason = "fontconfig-parser 0.5, under fontdb" },
    { crate = "miniz_oxide@0.8", reason = "png 0.18 and exr 1.74, under image, resvg and tiny-skia" },
    { crate = "phf@0.11", reason = "parcel_selectors 0.28 (cssparser is on 0.13)" },
    { crate = "phf_generator@0.11", reason = "phf_codegen 0.11, under parcel_selectors" },
    { crate = "phf_shared@0.11", reason = "phf 0.11, under parcel_selectors" },
    { crate = "thiserror@1", reason = "freedesktop-icons 0.4" },
    { crate = "thiserror-impl@1", reason = "thiserror 1, under freedesktop-icons" },
    { crate = "getrandom@0.2", reason = "const-random-macro 0.1, under ahash 0.8" },
    { crate = "getrandom@0.3", reason = "ahash 0.8 (uuid is on 0.4)" },
    { crate = "syn@1", reason = "lightningcss-derive 1.0.0-alpha.43" },
    { crate = "syn@2", reason = "arch-lint 0.11, miette-derive 7, multiversion-macros 0.8, phf_macros 0.13, rhai_codegen 3, thiserror-impl 1, tracing-attributes 0.1 and zerocopy-derive 0.8 (the rest are on syn 3)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
