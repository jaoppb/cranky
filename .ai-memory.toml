workspace = "default"
project = "jaoppb-cranky"
drop_subagent_captures = true

[briefing]
inject_on_session_start = true
max_chars = 4000

[capture]
ignore_paths = [
  ".env",
  ".env.*",
  "*.pem",
  "*.key",
  "*.p12",
  "*.pfx",
  "*.db",
  "*.sqlite*",
  "target/**",
  "coverage_report/**",
  "lcov.info",
  "*.profraw",
  "*.json.gz",
  "contrib/arch/src/**",
  "contrib/arch/pkg/**",
  "contrib/arch/*.pkg.tar.*",
  "contrib/arch/*.tar.gz",
  "contrib/arch/*.log",
  "contrib/arch/cranky-git/**",
  "SPEC.md",
  "*.swp",
  "*.swo",
  "*~",
  "__pycache__/**",
  "*.pyc",
]
