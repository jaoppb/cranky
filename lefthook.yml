# lefthook.yml
# Git hooks configuration for Cranky

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.rs"
      stage_fixed: true
      run: just lint-fix && just lint
    arch-check:
      glob: "*.rs"
      run: just arch-check
    loc-check:
      glob: "*.rs"
      run: just loc-check

pre-push:
  parallel: false
  commands:
    check:
      run: just check
