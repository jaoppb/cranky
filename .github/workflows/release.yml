name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Only the job that creates the GitHub release writes to the repository.
permissions:
  contents: read

jobs:
  # A release is a version bump merged through a pull request (`just
  # bump-version`), then this tag pushed on main. Nothing here pushes a commit
  # or moves a tag. A tag this job rejects is deleted and pushed again on the
  # right commit; it guards against mistakes, not against someone with push
  # access.
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every branch, to tell whether main contains the tag.
          fetch-depth: 0

      - name: Ensure the tag is a version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not of the form vX.Y.Z."
            exit 1
          fi

      # The full ref name: a tag named origin/main would shadow the short one.
      - name: Ensure the tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not reachable from origin/main."
            exit 1
          fi

      # tests/architecture.rs holds the PKGBUILD versions to this one.
      - name: Ensure the tag is the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version ${version} in Cargo.toml (expected v${version})."
            exit 1
          fi

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libdbus-1-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/cranky dist/
          cp README.md dist/
          cp LICENSE dist/
          tar -czvf dist/cranky-${{ github.ref_name }}-x86_64.tar.gz -C dist cranky README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cranky-${{ github.ref_name }}-x86_64.tar.gz
          generate_release_notes: true

  prepare-aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up variables
        id: vars
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums and .SRCINFO
        run: |
          # Run inside archlinux container
          docker run --rm -v ${{ github.workspace }}:/workspace archlinux:base-devel bash /workspace/.github/scripts/update-aur.sh

      - name: Upload cranky AUR package
        uses: actions/upload-artifact@v7
        with:
          name: aur-cranky
          path: contrib/arch/pkg-src/
          retention-days: 1

      - name: Upload cranky-bin AUR package
        uses: actions/upload-artifact@v7
        with:
          name: aur-cranky-bin
          path: contrib/arch/pkg-bin/
          retention-days: 1

  publish-aur:
    needs: prepare-aur
    runs-on: ubuntu-latest
    environment: aur-release
    strategy:
      matrix:
        include:
          - pkgname: cranky
            artifact: aur-cranky
          - pkgname: cranky-bin
            artifact: aur-cranky-bin
    steps:
      - name: Download prepared packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pkgname }}

      - name: Publish ${{ matrix.pkgname }} to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild: ${{ matrix.pkgname }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: 'Update to ${{ github.ref_name }}'
