name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag is on main branch
        run: |
          if ! git branch -r --contains ${{ github.ref }} | grep -q 'origin/main'; then
            echo "Error: Tag ${{ github.ref_name }} is not reachable from origin/main."
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Sync version and push
        id: sync_version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Tag version: $TAG_VERSION"

          echo "Updating Cargo.toml and PKGBUILDs to $TAG_VERSION..."
          sed -i "0,/^version = .*/s//version = \"$TAG_VERSION\"/" Cargo.toml

          sed -i "s/^pkgver=.*/pkgver=$TAG_VERSION/" contrib/arch/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" contrib/arch/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$TAG_VERSION/" contrib/arch/PKGBUILD-bin
          sed -i "s/^pkgrel=.*/pkgrel=1/" contrib/arch/PKGBUILD-bin

          # Update Cargo.lock
          cargo check

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock contrib/arch/PKGBUILD contrib/arch/PKGBUILD-bin

          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to $TAG_VERSION"
            git pull --rebase origin main
            git push origin HEAD:main

            # Re-tag the commit with the updated files
            git tag -f $GITHUB_REF_NAME
            git push origin $GITHUB_REF_NAME --force
          else
            echo "Versions already match. No commit needed."
          fi

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/cranky dist/
          cp README.md dist/
          cp LICENSE dist/
          tar -czvf dist/cranky-${{ github.ref_name }}-x86_64.tar.gz -C dist cranky README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cranky-${{ github.ref_name }}-x86_64.tar.gz
          generate_release_notes: true

  prepare-aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up variables
        id: vars
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Generate checksums and .SRCINFO
        run: |
          # Run inside archlinux container
          docker run --rm -v ${{ github.workspace }}:/workspace archlinux:base-devel bash /workspace/.github/scripts/update-aur.sh

      - name: Upload AUR packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aur-packages
          path: |
            contrib/arch/pkg-src/
            contrib/arch/pkg-bin/
          retention-days: 1

  publish-aur:
    needs: prepare-aur
    runs-on: ubuntu-latest
    environment: aur-release
    strategy:
      matrix:
        include:
          - pkgname: cranky
            dir: contrib/arch/pkg-src
          - pkgname: cranky-bin
            dir: contrib/arch/pkg-bin
    steps:
      - name: Download prepared packages
        uses: actions/download-artifact@v8
        with:
          name: aur-packages

      - name: Publish ${{ matrix.pkgname }} to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild_commit_dir: ${{ matrix.dir }}
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: 'Update to ${{ github.ref_name }}'
