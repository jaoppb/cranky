name: Tools

# Audits GitHub itself (issues, labels, milestones) against tools.toml; the
# merge settings, the Project title and Project membership are audited only
# locally, see the matrix. The drift it finds comes from GitHub state, not from commits, so
# it runs when an issue changes and when the declaration does, and it is not
# part of ci.yml: an ordinary pull request must not go red because of an issue
# someone else filed. Only one that changes the declaration or the pinned
# `tools` runs it.
on:
  issues:
    # Closing or deleting an issue can clear a finding: most rules look at open issues.
    types: [opened, edited, reopened, closed, deleted, transferred, labeled, unlabeled, milestoned, demilestoned]
  pull_request:
    paths: &declaration
      - tools.toml
      - .github/workflows/tools.yml
      # The Justfile is left out: its other recipes change far more often
      # than the two this workflow runs.
      # flake.nix and flake.lock pin the `tools` binary the recipes run.
      - flake.nix
      - flake.lock
  push:
    branches: [main]
    paths: *declaration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issues' && 'issues' || github.ref }}
  # A burst of issue events (one per label) keeps only its last run: each run
  # audits the whole repository, so the last one covers the others.
  cancel-in-progress: true

jobs:
  # One job per recipe, each inside the flake devShell like the jobs of
  # ci.yml, so the `tools` that runs here is the one flake.lock pins and a
  # local `just` uses.
  audit:
    name: ${{ matrix.recipe }}
    # tools.toml names this repository: a fork would audit it, not itself.
    if: github.repository == 'jaoppb/cranky'
    runs-on: ubuntu-latest
    # A pull request that moves the flake misses the Nix cache and builds `tools`.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      # The issue audit also reads the open pull requests.
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The rule that every issue is a card of the board is audited only
          # locally, by a bare `just issues-check`: nothing in CI adds the
          # cards. The audit still reads the board whenever tools.toml names
          # it, which the workflow token can do only while the board is public.
          - recipe: issues-check
            args: --no-membership
          # GitHub hides the merge settings from a read-only token, and
          # `tools` then assumes its defaults, which are the values
          # tools.toml declares: here that part would pass without checking
          # anything. A bare `just repo-check`, run locally by someone who
          # may push, audits the settings and the Project title as well.
          - recipe: repo-check
            args: --labels --milestones
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      # Read-only: the cache is the devShell's store, saved by ci.yml on `main`.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          save: false

      - name: Run just ${{ matrix.recipe }} ${{ matrix.args }}
        run: nix develop -c just ${{ matrix.recipe }} ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ github.token }}
