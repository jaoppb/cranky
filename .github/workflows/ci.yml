name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml calls this workflow so a release runs the same gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request's superseded run is cancelled; a run on `main` or for a
  # release is never cut short once it has started.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per kind of error, each running one `just` recipe inside the flake
  # devShell, so a red pull request names what failed and CI uses the tools a
  # local `nix develop` does, at the versions flake.lock pins. The job names
  # are the required status checks on `main`: renaming one means updating the
  # branch protection.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            recipe: fmt-check
          - name: lint
            recipe: lint
            compiles: true
          - name: arch
            recipe: arch-check
            compiles: true
          - name: loc
            recipe: loc-check
          - name: test
            recipe: test
            compiles: true
          - name: build
            recipe: release
            compiles: true
          - name: deps
            recipe: deps-check
          - name: coverage
            recipe: coverage-check
            compiles: true
          - name: bench
            recipe: bench-check
            compiles: true
          - name: workflows
            recipe: workflows-check
    steps:
      - uses: actions/checkout@v7

      # Single-user Nix, so the store belongs to the runner's user and the
      # next step can restore it.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      # One cache for every job: they all realise the same devShell. One job
      # of a run on `main` saves it, and a pull request reads that one. There
      # is no fallback to an older key: a store restored from one would be
      # saved again with the new closure on top, and grow at every update.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          save: ${{ github.ref == 'refs/heads/main' && matrix.name == 'fmt' }}

      - name: Restore the cargo cache
        if: matrix.compiles
        uses: Swatinem/rust-cache@v2
        with:
          # A new flake.lock can change the linker and the libraries the
          # cached artifacts point at.
          key: ${{ matrix.name }}-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The action asks rustc and cargo for the cache key; they exist only
          # inside the devShell.
          cmd-format: nix develop -c {0}

      - name: Run just ${{ matrix.recipe }}
        run: nix develop -c just ${{ matrix.recipe }}

  # The flake also exposes cranky as a package. Building it here keeps it from
  # rotting, and starting it proves the binary loads its libraries: given the
  # runtime directory it requires and no compositor, it logs its first line
  # and then fails to connect.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      # Read-only: the cache holds the devShell, which shares the toolchain
      # with the package.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          save: false

      - name: Build the package
        run: nix build --print-build-logs

      - name: Start the binary
        run: scripts/release/start.sh ./result/bin/cranky
