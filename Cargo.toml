[workspace]
members = ["crates/cranky-time", "crates/cranky-unsafe"]

[workspace.package]
version = "0.14.0"
edition = "2024"
authors = ["jao"]
license = "MIT"
repository = "https://github.com/jaoppb/cranky"
readme = "README.md"
keywords = ["wayland", "hyprland", "bar", "statusbar", "lua"]
categories = ["gui"]
# Neither crate is released to crates.io; `deny.toml` relies on this to accept
# the path dependency between them.
publish = false

[workspace.dependencies]
taffy = "0.12"
uuid = { version = "1.23", features = ["v4"] }

[package]
name = "cranky"
version.workspace = true
description = "A minimalist, performant, and modular bar for Hyprland"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints.rust]
unused = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "forbid"

# Groups are denied; every single lint below is forbidden, so no attribute in
# the code can lower it. `crates/cranky-unsafe/Cargo.toml` repeats this table
# without `unsafe_code`, and `tests/architecture.rs` checks the two agree.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
indexing_slicing = "forbid"
arithmetic_side_effects = "forbid"
unreachable = "forbid"
unimplemented = "forbid"
unchecked_time_subtraction = "forbid"
todo = "forbid"
string_slice = "forbid"
panic_in_result_fn = "forbid"
panic = "forbid"
exit = "forbid"
as_conversions = "forbid"
unwrap_in_result = "forbid"
get_unwrap = "forbid"
dbg_macro = "forbid"
print_stdout = "forbid"
print_stderr = "forbid"
self_named_module_files = "forbid"

[dependencies]
# Async Runtime
tokio = { version = "1.54", features = ["full"] }

# Wayland
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
thiserror = "2.0"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
toml = "1.0"

# Rendering
tiny-skia = "0.12"
cosmic-text = "0.19"
cranky-unsafe = { path = "crates/cranky-unsafe" }

# System Integration
zbus = { version = "6.3", features = ["tokio"] }
sysinfo = "0.39"
serde_json = "1.0"
cranky-time = { path = "crates/cranky-time" }
uuid = { workspace = true, features = ["serde"] }
notify = "8.2"
freedesktop-icons = "0.4"
# Default features minus avif: its encoder brings the unmaintained paste (RUSTSEC-2024-0436)
image = { version = "0.25", default-features = false, features = [
	"rayon",
	"bmp",
	"dds",
	"exr",
	"ff",
	"gif",
	"hdr",
	"ico",
	"jpeg",
	"png",
	"pnm",
	"qoi",
	"tga",
	"tiff",
	"webp",
] }
resvg = "0.50"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
mlua = { version = "0.11", features = [
	"lua54",
	"vendored",
	"serialize",
	"send",
] }
rhai = { version = "1.25", features = ["sync", "serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-appender = "0.2.5"
futures-util = "0.3.32"
taffy = { workspace = true }
futures = "0.3.34"
# No default features: sourcemap brings rkyv 0.7 (RUSTSEC-2026-0235)
lightningcss = { version = "1.0.0-alpha.63", default-features = false }
parcel_selectors = "0.28"
xkbcommon = "0.9.0"

[dev-dependencies]
arch-lint = "0.11"
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = false

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
debug = 1
