allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
# Identifier length (`clippy::min_ident_chars`, forbidden in `Cargo.toml`): a
# name of one or two characters is rejected unless listed here, and the list
# replaces clippy's default one. A scope may bind at most two single-character
# names, so `x` and `y` can appear together; cosmo's 1 would reject every
# coordinate pair a renderer has.
min-ident-chars-threshold = 2
allowed-idents-below-min-chars = ["x", "y", "id", "tx", "rx", "dx", "dy", "px"]
single-char-binding-names-threshold = 2
# Bool flags (`clippy::fn_params_excessive_bools`, `clippy::struct_excessive_bools`):
# no function takes a `bool` parameter and no struct holds a `bool` field, in
# tests too; a two-state value is an enum whose variants name each state.
max-fn-params-bools = 0
max-struct-bools = 0
# Arguments (`clippy::too_many_arguments`): no function takes more than three,
# counting `self`, in tests too; values that belong together travel as a type
# named after what it carries, and a function whose arguments show two jobs is
# split.
too-many-arguments-threshold = 3
# Function length and complexity (`clippy::too_many_lines`, denied with the
# `pedantic` group, and `clippy::cognitive_complexity`, forbidden in
# `Cargo.toml`): no function body runs past 25 lines or scores over 8, in tests
# too; a longer or more tangled function is split into helpers named after the
# one job each does.
too-many-lines-threshold = 25
cognitive-complexity-threshold = 8
# Older versions that only a dependency can drop, for `clippy::multiple_crate_versions`.
# The list names the same crates as the `skip` entries of the `[bans]` section in
# `deny.toml`, which records the dependency that still requires each one; keep both
# in step.
allowed-duplicate-crates = [
    "font-types",
    "fontdb",
    "getrandom",
    "harfrust",
    "miniz_oxide",
    "phf",
    "phf_generator",
    "phf_shared",
    "read-fonts",
    "roxmltree",
    "skrifa",
    "syn",
    "thiserror",
    "thiserror-impl",
    # Pulled only on targets `deny.toml` does not evaluate (UEFI and Windows), so
    # they have no `skip` entry there; clippy reads the lockfile for every target.
    "r-efi",
    "windows-sys",
]
